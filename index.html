<script>
    const PROFILES_API_URL = "https://8gb4zbvmdh.execute-api.us-east-1.amazonaws.com/profiles";
    let profiles = [];

    window.onload = function() {
        try {
            const savedProfiles = sessionStorage.getItem('fyers_cached_profiles');
            if (savedProfiles) {
                profiles = JSON.parse(savedProfiles);
                document.getElementById('passcodeModal').classList.add('hidden');
                populateDropdown();
                logMessage("Loaded profiles from secure session.");
            } else {
                logMessage("Awaiting security verification...");
            }
        } catch (e) {
            logMessage("Init note: " + e.message);
        }
    };

    async function verifyAndLoadProfiles() {
        const passcodeField = document.getElementById('passcodeInput');
        const errDiv = document.getElementById('passcodeError');
        if (!passcodeField) return;
        const passcode = passcodeField.value.trim();
        
        if (!passcode) {
            errDiv.textContent = "Passcode cannot be empty!";
            errDiv.classList.remove('hidden');
            return;
        }

        errDiv.classList.add('hidden');
        logMessage("Authenticating with AWS backend...");

        try {
            const response = await fetch(`${PROFILES_API_URL}?passcode=${encodeURIComponent(passcode)}`, {
                method: 'GET',
                headers: { 'Accept': 'application/json' }
            });

            if (response.status === 401) {
                errDiv.textContent = "Unauthorized: Incorrect passcode!";
                errDiv.classList.remove('hidden');
                return;
            }

            if (!response.ok) {
                throw new Error(`Server status ${response.status}`);
            }

            const data = await response.json();
            profiles = Array.isArray(data) ? data : (data.profiles || []);

            sessionStorage.setItem('fyers_cached_profiles', JSON.stringify(profiles));
            document.getElementById('passcodeModal').classList.add('hidden');
            populateDropdown();
            logMessage("Profiles loaded successfully from AWS DynamoDB.");

        } catch (error) {
            errDiv.textContent = `Connection error: ${error.message}`;
            errDiv.classList.remove('hidden');
            logMessage(`ERROR: ${error.message}`);
        }
    }

    function populateDropdown() {
        const select = document.getElementById('userSelect');
        if (!select) return;
        select.innerHTML = '<option value="">-- Choose User --</option>';
        profiles.forEach((p, index) => {
            const opt = document.createElement('option');
            opt.value = index;
            opt.textContent = (p.user_name || 'User') + ' (' + (p.app_id || '') + ')';
            select.appendChild(opt);
        });
    }

    function resetSession() {
        sessionStorage.removeItem('fyers_cached_profiles');
        location.reload();
    }

    function onUserChange() {
        const select = document.getElementById('userSelect');
        if (!select) return;
        const idx = select.value;
        
        const clientLbl = document.getElementById('lblClientId');
        const hashLbl = document.getElementById('lblHashId');
        const redirectLbl = document.getElementById('lblRedirectUrl');

        if (idx === "") {
            if (clientLbl) clientLbl.textContent = "-";
            if (hashLbl) hashLbl.textContent = "-";
            if (redirectLbl) redirectLbl.textContent = "-";
            return;
        }
        
        const p = profiles[idx];
        if (p) {
            if (clientLbl) clientLbl.textContent = p.app_id || '-';
            if (hashLbl) hashLbl.textContent = p.hash_id || '-';
            if (redirectLbl) redirectLbl.textContent = p.redirect_url || '-';
        }
    }

    function generateAuthUrl() {
        const select = document.getElementById('userSelect');
        if (!select || select.value === "") {
            alert("Please select a user profile first!");
            return;
        }
        const p = profiles[select.value];
        if (!p) return;
        
        const urlString = `https://api-t1.fyers.in/api/v3/generate-authcode?client_id=${encodeURIComponent(p.app_id)}&redirect_uri=${encodeURIComponent(p.redirect_url)}&response_type=code&state=om_sai_ram&nonce=nonce`;
        
        logMessage(`Opening Fyers login window for ${p.user_name}...`);
        window.open(urlString, '_blank');
    }

    async function validateAuthCode() {
        const select = document.getElementById('userSelect');
        if (!select || select.value === "") {
            alert("Please select a user profile first!");
            return;
        }
        const p = profiles[select.value];
        const inputField = document.getElementById('redirectUrlInput');
        if (!inputField) return;
        const inputVal = inputField.value.trim();
        
        if (!inputVal) {
            alert("Please paste the redirect URL or auth code first!");
            return;
        }

        let authCode = inputVal;
        if (inputVal.includes("auth_code=")) {
            try {
                const urlObj = new URL(inputVal.includes("http") ? inputVal : "http://localhost?" + inputVal);
                authCode = urlObj.searchParams.get("auth_code") || inputVal;
            } catch(err) {
                const match = inputVal.match(/auth_code=([^&]+)/);
                if (match) authCode = match[1];
            }
        }

        logMessage("Validating auth code with Fyers v3 API...");

        const payload = {
            grant_type: "authorization_code",
            appIdHash: p.hash_id.trim(),
            code: authCode.trim()
        };

        try {
            const response = await fetch('https://api-t1.fyers.in/api/v3/validate-authcode', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            
            if (data.s === "ok" || data.access_token) {
                const accessToken = data.access_token;
                logMessage(`SUCCESS: Access Token generated for ${p.user_name}!\nToken: ${accessToken.substring(0, 20)}...`);

                const syncCheck = document.getElementById('syncCloudCheck');
                if (syncCheck && syncCheck.checked) {
                    // Uses the token_sync_api_url fetched directly from DynamoDB for this specific user
                    await syncTokenToCloud(p, accessToken);
                }
            } else {
                logMessage(`FAILURE: Fyers validation failed.\nResponse: ${JSON.stringify(data, null, 2)}`);
            }

        } catch (error) {
            logMessage(`ERROR: Network exception during validation.\nDetails: ${error.message}`);
        }
    }

    async function syncTokenToCloud(p, accessToken) {
        const syncUrl = p.token_sync_api_url;
        if (!syncUrl) {
            logMessage("Cloud sync skipped: No token_sync_api_url defined for this profile.");
            return;
        }

        logMessage("Syncing token to profile-specific Cloud Gateway...");
        const payload = {
            userid: p.user_name,
            authCode: accessToken.trim()
        };

        try {
            const res = await fetch(syncUrl, {
                method: 'POST',
                headers: {
                    'Authorization': accessToken.trim(),
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                logMessage("Cloud token sync successful!");
            } else {
                logMessage("Cloud sync completed with non-200 status code.");
            }
        } catch (err) {
            logMessage(`Cloud sync warning: Could not reach endpoint (${err.message}).`);
        }
    }

    function logMessage(text) {
        const logBox = document.getElementById('outputLog');
        if (!logBox) return;
        const timestamp = new Date().toLocaleTimeString();
        logBox.textContent += `[${timestamp}] ${text}\n`;
        logBox.scrollTop = logBox.scrollHeight;
    }
</script>
